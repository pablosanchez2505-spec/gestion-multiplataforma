<ion-app>
  <ion-split-pane contentId="main-content">
    @if (auth.isLoggedIn()) {
      <ion-menu contentId="main-content" type="overlay">
        <ion-header>
          <ion-toolbar>
            <ion-title>Gestión</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-note class="ion-padding">{{ auth.user()?.name }} ({{ auth.user()?.role }})</ion-note>
          <ion-list lines="none">
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/home" routerLinkActive="selected" button detail="false">
                <ion-icon slot="start" name="home-outline" aria-hidden="true"></ion-icon>
                <ion-label>Inicio</ion-label>
              </ion-item>
            </ion-menu-toggle>

            @if (auth.hasRole('admin')) {
              <ion-menu-toggle auto-hide="false">
                <ion-item routerLink="/admin" routerLinkActive="selected" button detail="false">
                  <ion-icon slot="start" name="stats-chart-outline" aria-hidden="true"></ion-icon>
                  <ion-label>Dashboard</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }

            <ion-menu-toggle auto-hide="false">
              <ion-item (click)="logout()" button detail="false">
                <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
                <ion-label>Cerrar sesión</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        </ion-content>
      </ion-menu>
    }
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
